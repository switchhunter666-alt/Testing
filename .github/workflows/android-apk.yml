name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect installed Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Installed platforms:"
          ls -la "$SDK_ROOT/platforms" || true
          echo "Installed NDKs:"
          ls -la "$SDK_ROOT/ndk" || true
          echo "Installed CMake:"
          ls -la "$SDK_ROOT/cmake" || true
          API=$(find "$SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-*' -printf '%f\n' | sed -n 's/^android-\([0-9][0-9]*\)$/\1/p' | sort -nr | head -1)
          if [[ -z "$API" ]]; then
            echo "::error::No Android SDK platform installed on runner"
            exit 1
          fi
          echo "ANDROID_COMPILE_API=$API" >> "$GITHUB_ENV"
          echo "Selected compile SDK API $API"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package, signature, and arm64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Build tools: $TOOLS"
          test -f "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/debug/signature-report.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee app/build/outputs/apk/debug/package-report.txt
          grep -q "package: name='dev.nexus.omega'" app/build/outputs/apk/debug/package-report.txt
          unzip -Z -1 "$APK" | grep -q '^lib/arm64-v8a/libdiscord_native.so
          ( cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS )
          echo "APK verified. This is a DEBUG build signed by the current CI runner."
          echo "Its signing certificate may change on later runs. Uninstall earlier"
          echo "versions before installing a build with a different signature."
      - name: Upload verified APK and integrity details
        uses: actions/upload-artifact@v4
        with:
          name: nexus-omega-android-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signature-report.txt
            app/build/outputs/apk/debug/package-report.txt
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
