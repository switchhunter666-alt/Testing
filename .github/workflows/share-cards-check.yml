name: Verify NEXUS Share Cards

on:
  push:
    branches: [main, master]
    paths:
      - 'edge/share-cards/**'
      - '.github/workflows/share-cards-check.yml'
  pull_request:
    paths:
      - 'edge/share-cards/**'
      - '.github/workflows/share-cards-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test share card HTTP handler and payloads
        run: bun test edge/share-cards/src/index.test.js
      - name: Upload Cloudflare Worker source
        uses: actions/upload-artifact@v4
        with:
          name: nexus-share-cards-worker
          path: edge/share-cards/
          if-no-files-found: error
