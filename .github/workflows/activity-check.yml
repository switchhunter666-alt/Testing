name: Reality Room web build
on:
  push:
    paths:
      - 'activity/**'
      - '.github/workflows/activity-check.yml'
  pull_request:
    paths:
      - 'activity/**'
      - '.github/workflows/activity-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: activity
        run: npm install --no-audit --no-fund
      - name: Build Discord Activity
        working-directory: activity
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-reality-room-web
          path: activity/dist/
